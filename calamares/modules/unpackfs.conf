# Arcbase Desktop — copia del sistema sul disco
#
# La sorgente è la squashfs della live, già montata in sola lettura da
# live-init.sh (non l'overlay: le modifiche fatte durante la sessione live non
# finiscono sul disco). Una directory viene montata in bind; "ext4" serve solo
# a contare i file per la barra di avanzamento (con "squashfs" cercherebbe di
# leggere la directory con unsquashfs).
---
unpack:
    - source: "/run/arcbase-live/sfs"
      sourcefs: "ext4"
      destination: ""
      exclude:
          # L'utente della live non deve finire nel sistema installato
          # (la sua riga in /etc/passwd la toglie removeuser)
          - "/home/@LIVE_USER@/"
          # Installer: solo nella live
          - "/etc/calamares/"
          - "/usr/share/calamares/"
          - "/usr/lib/calamares/"
          - "/usr/lib/libcalamares*"
          - "/usr/lib/cmake/Calamares/"
          - "/usr/bin/calamares"
          - "/usr/bin/arcbase-install-gui"
          - "/usr/lib/arcbase/installer-root"
          - "/usr/share/applications/arcbase-install.desktop"
          - "/usr/share/polkit-1/actions/org.arcbase.installer.policy"
