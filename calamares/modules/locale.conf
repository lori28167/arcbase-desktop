# Arcbase Desktop — lingua, fuso orario
# region/zone sono quelli di ARC_TIMEZONE (install.sh li sostituisce)
---
region: "@REGION@"
zone:   "@ZONE@"

# Il fuso della sessione live non si cambia mentre si sceglie
adjustLiveTimezone: false

geoip:
    style:    "none"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
