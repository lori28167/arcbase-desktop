# Arcbase Desktop — utente, nome del computer
#
# Come arcbase-install: l'utente è amministratore (gruppo wheel, sudo con la
# propria password) e l'account root resta bloccato (lo blocca il passo finale
# shellprocess@cleanup; la root della live ha una password nota).
---
defaultGroups:
    - name: users
      must_exist: false
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - name: input
      must_exist: false
      system: true
    - name: render
      must_exist: false
      system: true
sudoersGroup:    wheel
autologinGroup:  autologin
sudoersConfigureWithGroup: false

# Niente password di root separata (root bloccato)
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin:      false

# Come arcbase-install: basta che la password non sia vuota. La casella
# "Richiedi password robuste" resta a disposizione, spenta.
passwordRequirements:
    minLength: 1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "arcbase"
    forbidden_names: [ localhost ]

allowActiveDirectory: false
