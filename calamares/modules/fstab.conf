# Arcbase Desktop — /etc/fstab
#
# Lo scrive Calamares (swap e partizioni extra comprese): arcbase-bootloader
# viene chiamato con --no-fstab per non sovrascriverlo.
---
crypttabOptions: luks
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: false
        options: ""
