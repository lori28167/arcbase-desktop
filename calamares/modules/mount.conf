# Arcbase Desktop — montaggio del sistema di destinazione (valori di Calamares)
#
# Gli extraMounts rendono utilizzabile il chroot (arcbase-bootloader ha bisogno
# di /dev, /proc, /sys e, in UEFI, di efivarfs per scrivere la voce nella NVRAM).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
