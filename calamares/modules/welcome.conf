# Arcbase Desktop — pagina di benvenuto: controlli prima di installare
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # Come arcbase-install: almeno 20 GB. 2 GiB di RAM bastano per la live
    requiredStorage:    20
    requiredRam:        2.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root

# Nessuna ricerca della posizione in rete: la lingua parte da quella della live
geoip:
    style:    "none"
    url:      "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
