# Arcbase Desktop — il log dell'installazione resta sul sistema installato
# (/var/log/Calamares.log): se qualcosa non va è il primo posto dove guardare.
# Il dump di Global Storage (from: config) no: contiene le password.
---
files:
    - from: log
      dest: /var/log/Calamares.log
      perm: root:root:0600
      optional: true
