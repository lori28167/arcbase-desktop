# Arcbase Desktop — partizionamento (KPMcore)
#
# Il sistema installato non ha initramfs: il kernel monta la root da solo, quindi
# la root deve stare su un filesystem e un driver compilati nel kernel (=y). Lo è
# solo ext4: xfs e btrfs sono moduli, LVM e LUKS richiedono un initramfs. Per
# questo qui si offre solo ext4 (la ESP resta FAT32) e niente cifratura/LVM.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        64MiB
    label:              "ARCBASE_EFI"

# "suspend" (ibernazione) richiede resume= e un initramfs: non offerta
userSwapChoices:
    - none
    - small
    - file

lvm:
    enable: false
enableLuksAutomatedPartitioning: false
preCheckEncryption: false
allowZfsEncryption: false
showNotEncryptedBootMessage: false

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]

# Con il partizionamento manuale la root può essere solo ext4 (vedi sopra); la
# ESP è sempre FAT32 (Calamares lo impone da solo). Le altre cartelle (/home...)
# possono usare ciò che il kernel sa montare.
# (Ogni elemento DEVE avere "directory": se ne manca uno Calamares scarta
# l'intero elenco senza dirlo.)
directoryFilesystemRestrictions:
    - directory: "/"
      allowedFilesystemTypes: ["ext4"]
