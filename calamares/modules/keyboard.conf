# Arcbase Desktop — tastiera
#
# Calamares scrive /etc/X11/xorg.conf.d/00-keyboard.conf e KEYMAP in
# /etc/vconsole.conf; il layout di KDE (kxkbrc) lo scrive arcbase_localize.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
# Niente keymap "convertite" (Debian): per la console vale la tabella interna
# di Calamares e, in mancanza, il nome del layout (come fa arcbase-install)
convertedKeymapPath: ""
writeEtcDefaultKeyboard: false
useLocale1: false
configure:
    kwin: false
