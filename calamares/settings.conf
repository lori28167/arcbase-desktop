# =============================================================================
#  Arcbase Desktop — impostazioni di Calamares (installer grafico della ISO live)
#
#  Le installa calamares/install.sh in /etc/calamares della ISO (non nel sistema
#  installato). Il sistema da copiare è la squashfs della live; il bootloader lo
#  installa arcbase-bootloader (GRUB senza initramfs: root=PARTUUID=...), non il
#  modulo "bootloader" di Calamares, che si aspetta grub-mkconfig e un initramfs.
# =============================================================================
---
modules-search: [ local ]

instances:
# Dopo l'installazione: root bloccato (si usa sudo) e live ripulita
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - removeuser         # l'utente della live, prima di creare il nuovo (libera l'UID 1000)
  - fstab
  - locale
  - keyboard
  - arcbase_localize
  - users
  - arcbase_bootloader
  - shellprocess@cleanup
  - preservefiles      # il log dell'installazione, sul sistema installato
  - umount
- show:
  - finished

branding: arcbase

# Prima di toccare il disco si chiede conferma (dopo il riepilogo)
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
# Non si interrompe a metà partizionamento o copia
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
