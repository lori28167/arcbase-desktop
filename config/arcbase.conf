# shellcheck shell=bash
# =============================================================================
#  Arcbase Desktop — configurazione di build
#
#  Ogni variabile può essere sovrascritta creando config/local.conf (ignorato
#  da git) oppure esportandola nell'ambiente prima di lanciare `make`.
# =============================================================================

# --- Identità della distribuzione --------------------------------------------
ARC_NAME="Arcbase Desktop"
ARC_ID=arcbase
ARC_VERSION=1.0
ARC_CODENAME=fusion
ARC_HOME_URL="https://github.com/lori28167/arcbase-desktop"

# --- Ambiente di build LFS ---------------------------------------------------
# Punto di montaggio della partizione (o directory) di destinazione.
# Dentro il chroot LFS vale "" (stringa vuota): per questo si usa ${VAR=...},
# che assegna il default solo se la variabile non è definita.
: "${LFS=/mnt/lfs}"
: "${LFS_TGT=x86_64-arcbase-linux-gnu}"
# Versione del libro LFS a cui sono allineate le ricette (sorgenti + md5sums).
: "${LFS_BOOK_VERSION=12.3}"
: "${LFS_BOOK_URL=https://www.linuxfromscratch.org/lfs/view/${LFS_BOOK_VERSION}-systemd}"
# Mirror completo dei sorgenti LFS, usato come fallback per i download.
: "${LFS_SOURCES_MIRROR=https://ftp.osuosl.org/pub/lfs/lfs-packages/${LFS_BOOK_VERSION}}"
# Numero di processi paralleli. MAKEFLAGS viene sempre ricalcolato: GNU make
# esporta un MAKEFLAGS (vuoto, o con --jobserver-auth) che non va ereditato.
: "${ARC_JOBS:=$(nproc)}"
MAKEFLAGS="-j$ARC_JOBS"
export MAKEFLAGS
# 1 = esegue le test suite (molto più lento; i fallimenti vengono solo segnalati)
: "${LFS_TESTS=0}"
# 1 = mostra l'output di compilazione a terminale oltre che nei log
: "${LFS_VERBOSE=0}"

# --- Sistema installato ------------------------------------------------------
: "${ARC_HOSTNAME=arcbase}"
: "${ARC_TIMEZONE=Europe/Rome}"
: "${ARC_LOCALE=it_IT.UTF-8}"
# Locale aggiuntive da generare (oltre a C.UTF-8 e ARC_LOCALE)
: "${ARC_EXTRA_LOCALES=en_US.UTF-8}"
: "${ARC_KEYMAP=it}"
: "${ARC_CONSOLE_FONT=Lat2-Terminus16}"
# Utente desktop creato in fase di configurazione (gruppo wheel => sudo)
: "${ARC_USER=arc}"
: "${ARC_USER_FULLNAME=Arcbase User}"
# Password iniziali: CAMBIARLE al primo avvio (`passwd`)!
: "${ARC_USER_PASSWORD=arcbase}"
: "${ARC_ROOT_PASSWORD=arcbase}"

# --- Gestori di pacchetti ----------------------------------------------------
# Repository Arch Linux abilitati in /etc/pacman.conf
: "${ARC_ARCH_REPOS=core extra}"
: "${ARC_ARCH_MIRROR=https://geo.mirror.pkgbuild.com/\$repo/os/\$arch}"
# Layer Debian (apt/dpkg)
: "${ARC_DEBIAN_SUITE=trixie}"
: "${ARC_DEBIAN_MIRROR=http://deb.debian.org/debian}"
: "${ARC_DEBIAN_SECURITY_MIRROR=http://security.debian.org/debian-security}"
: "${ARC_DEBIAN_COMPONENTS=main contrib non-free non-free-firmware}"
# yes = crea il layer Debian già durante la build (richiede rete nel chroot)
: "${ARC_DEBIAN_INIT_AT_BUILD=yes}"
# Pacchetti Debian da preinstallare nel layer (separati da spazio)
: "${ARC_DEBIAN_PACKAGES=}"
# Ordine di risoluzione di `arc install <nome>`: arch | debian
: "${ARC_PREFER=arch}"
# Allineamento delle librerie runtime ABI-critiche ai repository Arch:
#   auto  = adotta il pacchetto Arch se più recente della versione LFS
#   never = mantiene sempre le librerie compilate da sorgente
: "${ARC_RUNTIME_SYNC=auto}"
: "${ARC_RUNTIME_SYNC_PKGS=glibc gcc-libs libgcc libstdc++}"

# --- Desktop -----------------------------------------------------------------
# kde | gnome | xfce | none  (vedi config/desktop/<nome>.list)
: "${ARC_DESKTOP=kde}"
# Pacchetti Arch installati sempre (firmware, rete, audio, strumenti base)
: "${ARC_COMMON_PACKAGES=linux-firmware sof-firmware sudo networkmanager pipewire pipewire-pulse pipewire-alsa wireplumber mesa vulkan-icd-loader xdg-user-dirs xdg-utils noto-fonts noto-fonts-emoji ttf-dejavu firefox}"

# --- Immagine disco ----------------------------------------------------------
: "${ARC_OUT_DIR=$PWD/out}"
: "${ARC_IMAGE_SIZE=32G}"
# yes = converte anche in qcow2 (richiede qemu-img sull'host)
: "${ARC_IMAGE_QCOW2=no}"
